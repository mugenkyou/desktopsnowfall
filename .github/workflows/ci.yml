name: CI

# Builds and tests both versions on every push and pull request.
# Windows: build (warnings are errors) + the headless self-tests + a single-file exe.
# macOS:   compile on a real Mac (both CPU types), package the .app, and a 15-second launch smoke test.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · build + self-tests
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (warnings are errors)
        run: dotnet build windows/desktopsnowfall.csproj -c Release -warnaserror

      - name: Self-tests (simulation, physics, visitors, drawing)
        run: dotnet run -c Release --project windows/tests/desktopsnowfall.tests.csproj

      - name: Publish single-file exe (x64)
        run: >
          dotnet publish windows/desktopsnowfall.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: desktopsnowfall-windows-x64
          path: out/win-x64/desktopsnowfall.exe
          retention-days: 14

  macos:
    name: macOS · compile + package + launch smoke test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version

      # Compile both architectures; compiler errors are turned into annotations so they show up in the run summary
      - name: Compile (arm64 + x86_64)
        shell: bash
        run: |
          set -o pipefail
          status=0
          for arch in arm64 x86_64; do
            echo "::group::swiftc $arch"
            if ! xcrun swiftc -O -target $arch-apple-macos12 desktopsnowfall.swift -o /tmp/dsf-$arch 2>&1 | tee build-$arch.log; then status=1; fi
            echo "::endgroup::"
            sed -nE 's/^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::\4 file=\1,line=\2,col=\3::\5/p' build-$arch.log | sort -u
          done
          exit $status

      - name: Package unsigned .app (ad-hoc signature)
        run: zsh make_app.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"

      # Hosted macOS runners have a logged-in desktop session, so the app can start. This only shows that it
      # launches and keeps running; it does not check how anything looks or behaves.
      - name: Launch smoke test (15 s)
        shell: bash
        run: |
          app=dist/desktopsnowfall.app/Contents/MacOS/desktopsnowfall
          "$app" > launch.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 $pid 2>/dev/null; then
            echo "desktopsnowfall is still running after 15 s"
            screencapture -x screen.png || echo "::warning::screencapture failed (screen recording not allowed on this runner)"
            kill $pid
          else
            wait $pid; code=$?
            echo "::error::desktopsnowfall exited early (code $code)"
            cat launch.log
            exit 1
          fi
          cat launch.log

      - uses: actions/upload-artifact@v4
        with:
          name: desktopsnowfall-macos
          path: dist/*.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: screen.png
          if-no-files-found: ignore
          retention-days: 7
