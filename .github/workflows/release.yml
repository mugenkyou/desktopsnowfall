name: Release

# Push a tag like v1.2.0 to build everything and publish a GitHub release with the downloads and their
# SHA-256 checksums. It goes live straight away (the self-tests have to pass first).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows builds
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Self-tests
        run: dotnet run -c Release --project windows/tests/desktopsnowfall.tests.csproj
      - name: Publish x64 and arm64 (single file, trimmed)
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/desktopsnowfall.csproj -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$v -warnaserror -o out/$rid
            Compress-Archive -Path out/$rid/desktopsnowfall.exe -DestinationPath "out/desktopsnowfall-$rid-portable-v$v.zip"
          }
      - name: Installer (x64; also runs on Windows on Arm)
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v /DSourceExe="$PWD\out\win-x64\desktopsnowfall.exe" installer\desktopsnowfall.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/desktopsnowfall-win-*-portable-*.zip
            out/desktopsnowfall-setup-*.exe

  macos:
    name: macOS build
    runs-on: macos-latest   # (pinned versions get retired; macos-14 already was)
    steps:
      - uses: actions/checkout@v4
      - name: Build universal .app (ad-hoc signed, not notarized)
        run: zsh make_app.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # Same file names for every version, so links to releases/latest/download/<name> always get the newest
      - name: Drop the version from the file names
        working-directory: files
        run: for f in *-v*; do mv "$f" "${f/-${GITHUB_REF_NAME}/}"; done
      - name: Checksums
        working-directory: files
        run: sha256sum *.zip *.exe | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --latest
          --title "desktopsnowfall $GITHUB_REF_NAME" --generate-notes
